name: Build Meridian
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix cmake ninja-build
      - run: bash scripts/build-wsl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend
          path: .build/windows/Meridian.exe
          include-hidden-files: true
  portable:
    needs: frontend
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend
          path: .build/windows
      - run: python -m pip install -r requirements-lock.txt pyinstaller==6.19.0
      - shell: pwsh
        run: ./scripts/package.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-0.1.0-release
          path: |
            release/*.zip
            release/SHA256SUMS.txt
